# OpenOCD configuration for x-heep on Nexys4 / Nexys A7 using Digilent HS2.
#
# The x-heep Nexys bitstream exposes the RISC-V debug JTAG on PMOD JB,
# not on the board's onboard USB-JTAG configuration chain.
#
# PMOD JB wiring from hw/fpga/constraints/nexys/pin_assign.xdc:
#   HS2 TMS -> JB[7]  / E16 -> jtag_tms_i
#   HS2 TDI -> JB[8]  / F13 -> jtag_tdi_i
#   HS2 TDO -> JB[9]  / G13 -> jtag_tdo_o
#   HS2 TCK -> JB[10] / H16 -> jtag_tck_i
#   HS2 GND -> JB GND
#   jtag_trst_ni is mapped to SW0/J15; set SW0 high/deasserted.

adapter driver ftdi
adapter speed 1000
transport select jtag
bindto 0.0.0.0

# Digilent HS2, FT232H
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb

reset_config none

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10001c05

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid 0x000

log_output openocd_nexys4_hs2.log

riscv set_reset_timeout_sec 2000
riscv set_command_timeout_sec 2000
if {[catch {riscv set_prefer_sba off} _err]} {
    echo "notice: riscv set_prefer_sba unsupported in this OpenOCD build; continuing"
}

scan_chain
init
halt
echo "Nexys RISC-V core halted - ready for GDB on port 3333"
