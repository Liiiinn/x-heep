# OpenOCD configuration for CW305 (Artix-7) + Digilent HS2 cable
#
# Connections (JP3 debug header on CW305):
#   HS2 TCK  -> JP3 B15  (swclk)
#   HS2 TMS  -> JP3 A13  (swdio)
#   HS2 TDI  -> JP3 B12  (TDI)
#   HS2 TDO  -> JP3 C11  (SWOTDO)
#   HS2 GND  -> JP3 GND
#   (nTRST / JP3 C14 is optional; tie high or leave unconnected)
#
# After OpenOCD starts, connect GDB on port 3333:
#   riscv32-unknown-elf-gdb sw/build/main.elf -x sw/gdbInit

adapter driver ftdi
adapter speed 1000
transport select jtag

# Digilent HS2 (FT232H, VID=0x0403 PID=0x6014)
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb

reset_config none

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10001c05

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid 0x000

log_output openocd_cw305.log

riscv set_reset_timeout_sec 2000
riscv set_command_timeout_sec 2000
riscv set_prefer_sba off

scan_chain
init
halt
echo "CW305 RISC-V core halted — ready for GDB on port 3333"
