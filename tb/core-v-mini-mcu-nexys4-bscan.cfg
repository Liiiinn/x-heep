# OpenOCD configuration for x-heep on Nexys4 / Nexys A7 using the board USB-JTAG.
#
# This config is for bitstreams built with:
#   FUSESOC_FLAGS=--flag=use_bscane_xilinx
#
# No external HS2/JTAG cable is used. The RISC-V debug module is reached through
# Xilinx BSCANE2 user instructions on the FPGA configuration JTAG chain.

adapter driver ftdi
adapter speed 1000
transport select jtag

if {![info exists NEXYS_BIND_ADDR]} {
    set NEXYS_BIND_ADDR 127.0.0.1
}
bindto $NEXYS_BIND_ADDR

if {![info exists NEXYS_GDB_PORT]} {
    set NEXYS_GDB_PORT 13333
}

# Nexys4 / Nexys A7 onboard FT2232 USB-JTAG/UART.
# Keep the UART interface as the Windows COM port; OpenOCD must access only the
# JTAG interface. Most Nexys A7/Nexys4 setups use channel 0 for JTAG and channel
# 1 for UART. If your board enumerates differently, override with:
#   openocd -c "set NEXYS_FTDI_CHANNEL 1" -f core-v-mini-mcu-nexys4-bscan.cfg
if {![info exists NEXYS_FTDI_CHANNEL]} {
    set NEXYS_FTDI_CHANNEL 0
}

ftdi vid_pid 0x0403 0x6010
ftdi channel $NEXYS_FTDI_CHANNEL
ftdi layout_init 0x0088 0x008b
reset_config none

if {[catch {ftdi tdo_sample_edge falling} _err]} {
    echo "notice: ftdi tdo_sample_edge unsupported in this OpenOCD build; continuing"
}

set _CHIPNAME riscv

# Artix-7 100T has IR length 6. The top nibble is the silicon version, so keep
# a few common versions accepted.
jtag newtap $_CHIPNAME cpu -irlen 6 \
    -expected-id 0x03631093 \
    -expected-id 0x13631093 \
    -expected-id 0x23631093 \
    -expected-id 0x33631093

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid 0x000

log_output openocd_nexys4_bscan.log

# Xilinx 7-series BSCANE2 USER instructions used by pulp-platform/riscv-dbg.
riscv set_ir idcode 0x09
riscv set_ir dtmcs 0x22
riscv set_ir dmi 0x23

riscv set_reset_timeout_sec 2000
riscv set_command_timeout_sec 2000

scan_chain
init
halt
echo "Nexys BSCANE RISC-V core halted - ready for GDB on port $NEXYS_GDB_PORT"
